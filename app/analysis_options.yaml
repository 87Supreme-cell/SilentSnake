# No hosted lint package (flutter_lints would be a new dependency); rules listed explicitly.
analyzer:
  exclude:
    - build/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true
linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - avoid_dynamic_calls
    - use_key_in_widget_constructors
