# Release on a signed version tag (docs/decisions/0002): verify the tag signature against
# .github/allowed_signers, build with scripts/release.sh, sign keyless with cosign (Sigstore,
# identity = this workflow), attach SLSA build provenance, publish a GitHub release.
# Create a release:  git tag -s v0.1.0 -m "SilentSnake 0.1.0" && git push origin v0.1.0
name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write        # create the GitHub release
      id-token: write        # Sigstore keyless signing (OIDC)
      attestations: write    # SLSA build provenance
    env:
      TAG: ${{ github.ref_name }}
      TARGET: fedora-45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is signed by an allowed signer and matches the version
        run: |
          set -euo pipefail
          [ "$(git cat-file -t "$TAG")" = tag ] || { echo "tag $TAG is not an annotated, signed tag"; exit 1; }
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/allowed_signers tag -v "$TAG"
          [ "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" ] || { echo "tag does not point at the built commit"; exit 1; }
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }

      - name: Build pinned dev container
        run: scripts/dev.sh true

      - name: Build release (gates, reproducible x2, smoke, package)
        run: scripts/release.sh "$TARGET"

      - name: Install cosign 3.1.4 (same pin and hash as dev/Containerfile)
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/cosign"

      - name: Sign keyless with cosign
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            "$RUNNER_TEMP/cosign" sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Verify signature before publishing
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            "$RUNNER_TEMP/cosign" verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="$(ls dist/*.tar.gz)"
          base="$(basename "$tarball")"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          SilentSnake capture engine $TAG for $TARGET (x86_64). Built from \`$GITHUB_SHA\` by this workflow.

          ## Verify before installing
          \`\`\`sh
          sha256sum -c $base.sha256
          cosign verify-blob --bundle $base.sigstore.json \\
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com $base
          gh attestation verify $base --repo $GITHUB_REPOSITORY
          \`\`\`

          ## Install
          \`\`\`sh
          tar -xzf $base && cd ${base%.tar.gz} && ./install.sh
          \`\`\`
          The installer refuses root, re-checks every file against SHA256SUMS, installs to ~/.local/bin with
          mode 0700 and grants only CAP_NET_RAW (sudo setcap). Output goes to stdout only; don't redirect it
          to a file until the encrypted log store ships.
          EOF
          gh release create "$TAG" --verify-tag --title "SilentSnake $TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "$tarball" "$tarball.sha256" "$tarball.sigstore.json"
